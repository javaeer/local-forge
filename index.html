<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="LocalForge · 纯浏览器端的本地工坊：文件、数据与知识皆是原料，55 道工序在本地锤炼成可用成果，全程不出设备。压缩、解压、转码、PDF、OCR、离线词典、诗词格律、中医经典一应俱全。" />
    <meta name="theme-color" content="#e8954a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LocalForge" />
    <title>LocalForge · 本地工坊</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // PWA：注册 Service Worker。https 与 localhost/127.0.0.1 均为安全上下文，可注册；
      // 其余（如 file:// 或 http 内网 IP）自动跳过，不影响使用。
      if ('serviceWorker' in navigator && (window.isSecureContext)) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () { /* 注册失败不阻断使用 */ })
        })
      }
    </script>
  </body>
</html>
