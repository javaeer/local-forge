name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 重型 e2e（ffmpeg 多线程 / Tesseract OCR / 大文件）跑得慢且依赖特殊内核，不进普通 CI：
  # 每周一 03:17 UTC 自动夜跑，或手动在 Actions 面板触发。
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm >= 10：仓库根目录的 pnpm-workspace.yaml 使用了 pnpm 10 才支持的
      # `allowBuilds` 字段（且不再声明 packages 字段），pnpm 9 会因为
      # “packages field missing or empty” 直接报错，导致后续步骤全部跳过。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 一致性护栏：静态断言 NAV / router / VIEW_ROUTES / 首页卡片 / i18n key 四处数据源互不漂移。
      # 零依赖（纯 node 扫描源码），放在 build 之前以便快速失败。
      - name: Consistency guardrails
        run: node scripts/check-consistency.mjs

      - name: Build
        run: pnpm build

      # 产物体积预算检查（阶段 D）：防单 chunk / 应用代码 / WASM 内核反常膨胀。
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

  # 纯逻辑单元测试（零 DOM 依赖，node --test 跑），快、稳，普通 CI 必跑。
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit

  # 端到端核心组（core）：快、稳，CI 默认跑。runner 会自动拉起 vite preview 并注入环境变量。
  e2e-core:
    name: E2E (core)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: npx puppeteer browsers install chrome
      - name: Link Chromium to /usr/bin/chromium
        run: |
          CHROME=$(find "$HOME/.cache/puppeteer/chrome" -name chrome -type f | head -1)
          ln -sf "$CHROME" /usr/bin/chromium
          echo "CHROMIUM_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"
      - name: Run core e2e
        run: pnpm test:e2e

  # 重型 e2e（heavy）：慢 / 需特殊内核，仅夜跑或手动触发。
  e2e-heavy:
    name: E2E (heavy, nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: npx puppeteer browsers install chrome
      - name: Link Chromium to /usr/bin/chromium
        run: |
          CHROME=$(find "$HOME/.cache/puppeteer/chrome" -name chrome -type f | head -1)
          ln -sf "$CHROME" /usr/bin/chromium
          echo "CHROMIUM_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"
      - name: Run heavy e2e
        run: pnpm test:e2e:heavy
