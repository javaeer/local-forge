name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm >= 10：仓库根目录的 pnpm-workspace.yaml 使用了 pnpm 10 才支持的
      # `allowBuilds` 字段（且不再声明 packages 字段），pnpm 9 会因为
      # “packages field missing or empty” 直接报错，导致后续步骤全部跳过。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # 端到端测试（可选，默认关闭以免在 CI 拉起 Chromium 造成抖动）。
  # 如需启用，取消注释并安装浏览器，本地用 `pnpm test:e2e` 即可验证。
