name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 重型 e2e（ffmpeg 多线程 / Tesseract OCR / 大文件）跑得慢且依赖特殊内核，不进普通 CI：
  # 每周一 03:17 UTC 自动夜跑，或手动在 Actions 面板触发。
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm >= 10：仓库根目录的 pnpm-workspace.yaml 使用了 pnpm 10 才支持的
      # `allowBuilds` 字段（且不再声明 packages 字段），pnpm 9 会因为
      # “packages field missing or empty” 直接报错，导致后续步骤全部跳过。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 一致性护栏：静态断言 NAV / router / VIEW_ROUTES / 首页卡片 / i18n key 四处数据源互不漂移。
      # 零依赖（纯 node 扫描源码），放在 build 之前以便快速失败。
      - name: Consistency guardrails
        run: node scripts/check-consistency.mjs

      - name: Build
        run: pnpm build

      # 产物体积预算检查（阶段 D）：防单 chunk / 应用代码 / WASM 内核反常膨胀。
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

  # 纯逻辑单元测试（零 DOM 依赖，node --test 跑），快、稳，普通 CI 必跑。
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit

  # 端到端核心组（core）：快、稳，CI 默认跑。runner 会自动拉起 vite preview 并注入环境变量。
  e2e-core:
    name: E2E (core)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 关键：e2e 是独立 job / 独立 checkout，拿不到 build job 的 dist，也没有
      # gitignore 的离线数据快照（WASM / 词典 / 诗文 / 中医）。依赖这些数据的
      # dictionary/tcmchants/bencao/tcmbooks/classicsfull 会因 .gz 回退成 HTML 而超时。
      # 两步缺一不可：
      #   1) prepare-e2e-data：补齐 prebuild 故意跳过的 66MB ECDICT 与全量诗文库；
      #   2) pnpm build：prebuild 拉其余小快照 + vite build 把 public/ 拷进 dist/。
      # 全部脚本幂等（已有有效快照跳过），裸 `vite build` 不够（绕过 prebuild）。
      - name: Prepare data & build (for preview e2e)
        run: |
          node scripts/prepare-e2e-data.mjs
          pnpm build
      # 不再软链到 /usr/bin（runner 用户无写权限，长期红灯）。
      # 直接把探测到的绝对路径注入环境变量；tests/run.mjs 优先读 CHROME_PATH
      # 并再次注入每个 e2e 子进程，脚本无需硬编码系统路径。
      - name: Install Chromium & expose path
        run: |
          npx puppeteer browsers install chrome
          # 关键：必须明确优先「完整 chrome」。此前 `find ... | head -1` 会按字典序
          # 命中 chrome-headless-shell（剪贴板/阶段进度渲染行为与完整 chrome 不同），
          # 导致 bencao/tcmbooks 的「复制全文 toast」与 progress 阶段组件在 CI 下失败，
          # 而本地用完整 chrome 全过。仅当完整 chrome 确实不存在时才回退 shell。
          CHROME=$(find "$HOME/.cache/puppeteer/chrome" -type f -name chrome 2>/dev/null | head -1)
          if [ -z "$CHROME" ]; then
            CHROME=$(find "$HOME/.cache/puppeteer" -type f -name chrome-headless-shell 2>/dev/null | head -1)
          fi
          test -n "$CHROME" || { echo "::error::未找到 Chromium 可执行文件"; exit 1; }
          chmod +x "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "使用浏览器：$CHROME"
      - name: Run core e2e
        run: pnpm test:e2e

  # 重型 e2e（heavy）：慢 / 需特殊内核，仅夜跑或手动触发。
  e2e-heavy:
    name: E2E (heavy, nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 同 e2e-core：独立 checkout 需自带数据快照与 dist，否则依赖快照的用例必挂。
      - name: Prepare data & build (for preview e2e)
        run: |
          node scripts/prepare-e2e-data.mjs
          pnpm build
      # 同 e2e-core：注入绝对路径，不再写 /usr/bin。
      - name: Install Chromium & expose path
        run: |
          npx puppeteer browsers install chrome
          CHROME=$(find "$HOME/.cache/puppeteer" -type f \( -name chrome -o -name chrome-headless-shell \) | head -1)
          test -n "$CHROME" || { echo "::error::未找到 Chromium 可执行文件"; exit 1; }
          chmod +x "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "使用浏览器：$CHROME"
      - name: Run heavy e2e
        run: pnpm test:e2e:heavy
